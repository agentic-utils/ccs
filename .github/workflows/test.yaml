name: Test

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # The race detector over the whole suite: prompts are held and answered
      # across goroutines and sockets, and it costs about 10% more time.
      - name: Run tests
        run: go test -race -v -cover ./...

      - name: Build
        run: go build -o ccs .
